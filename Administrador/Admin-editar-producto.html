<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModaExpress - Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/admin-styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse shadow-sm">
                <div class="position-sticky pt-4">
                    <div class="text-center mb-4">
                        <h4 class="brand-text">ModaExpress</h4>
                        <span class="badge bg-primary">Panel Admin</span>
                    </div>
                    <ul class="nav flex-column gap-2 px-2">
                        <li class="nav-item"><a class="nav-link menu-link" href="Administrador.html">🏠 Home</a></li>
                        <li class="nav-item"><a class="nav-link active menu-link" href="Admin-productos.html">📦 Mantenedor Productos</a></li>
                        <li class="nav-item"><a class="nav-link menu-link" href="Admin-usuarios.html">👥 Mantenedor Usuarios</a></li>
                    </ul>
                </div>
            </nav>

            
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <div class="pt-4 pb-2 mb-4 border-bottom">
                    <h1 class="h2 main-title">Editar Producto</h1>
                </div>

                <div class="bg-white p-4 rounded shadow-sm border mb-5">
                    <form id="formEditarProducto">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="codigo" class="form-label fw-bold">Código del Producto *</label>
                                
                                <input type="text" class="form-control" id="codigo" value="PR001" readonly required>
                            </div>
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-bold">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" value="Polera básica algodón" maxlength="100" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-bold">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="3" maxlength="500">Polera 100% algodón ideal para el verano.</textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="precio" class="form-label fw-bold">Precio *</label>
                                <input type="number" class="form-control" id="precio" value="12000" min="0" step="0.01" required>
                            </div>
                            <div class="col-md-4">
                                <label for="stock" class="form-label fw-bold">Stock Actual *</label>
                                <input type="number" class="form-control" id="stock" value="45" min="0" step="1" required>
                            </div>
                            <div class="col-md-4">
                                <label for="stockCritico" class="form-label fw-bold">Stock Crítico</label>
                                <input type="number" class="form-control" id="stockCritico" value="10" min="0" step="1">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-bold">Categoría *</label>
                                <select class="form-select" id="categoria" required>
                                    <option value="hombre" selected>Hombre</option>
                                    <option value="mujer">Mujer</option>
                                    <option value="nino">Niño</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="Admin-productos.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">Actualizar Producto</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script src="../JS/admin.js"></script>
</body>
</html>
