<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModaExpress - Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/admin-styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse shadow-sm">
                <div class="position-sticky pt-4">
                    <div class="text-center mb-4">
                        <h4 class="brand-text">ModaExpress</h4>
                        <span class="badge bg-primary">Panel Admin</span>
                    </div>
                    <ul class="nav flex-column gap-2 px-2">
                        <li class="nav-item"><a class="nav-link menu-link" href="Administrador.html">🏠 Home</a></li>
                        <li class="nav-item"><a class="nav-link menu-link" href="Admin-productos.html">📦 Mantenedor Productos</a></li>
                        <li class="nav-item"><a class="nav-link active menu-link" href="Admin-usuarios.html">👥 Mantenedor Usuarios</a></li>
                    </ul>
                </div>
            </nav>

           
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <div class="pt-4 pb-2 mb-4 border-bottom">
                    <h1 class="h2 main-title">Editar Usuario</h1>
                </div>

                <div class="bg-white p-4 rounded shadow-sm border mb-5">
                    <form id="formEditarUsuario">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="run" class="form-label fw-bold">RUN (Sin puntos ni guion) *</label>
                                <input type="text" class="form-control" id="run" value="19011022K" readonly required>
                            </div>
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-bold">Nombres *</label>
                                <input type="text" class="form-control" id="nombre" value="Juan Pérez" maxlength="50" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="correo" class="form-label fw-bold">Correo Electrónico *</label>
                                <input type="email" class="form-control" id="correo" value="juan@duoc.cl" maxlength="100" required>
                            </div>
                            <div class="col-md-6">
                                <label for="tipoUsuario" class="form-label fw-bold">Tipo de Usuario *</label>
                                <select class="form-select" id="tipoUsuario" required>
                                    <option value="administrador">Administrador</option>
                                    <option value="vendedor" selected>Vendedor</option>
                                    <option value="cliente">Cliente</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="Admin-usuarios.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">Actualizar Usuario</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script src="../JS/admin.js"></script>
</body>
</html>
